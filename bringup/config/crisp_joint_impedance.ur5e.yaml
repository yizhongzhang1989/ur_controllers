# crisp joint impedance (role) — UR5e in MuJoCo sim.
#
# Applies the `crisp_controllers/CartesianController` plugin in its
# "joint_impedance" configuration (see docs/crisp_controllers.md):
#   - all Cartesian task stiffnesses are zero,
#   - nullspace projector is "none" so the nullspace PD directly drives
#     every joint,
#   - gravity + Coriolis compensation come from pinocchio inside the
#     controller (no longer relying on the sim's gravity_compensation.py
#     because forward_effort_controller is deactivated before this
#     controller activates).
#
# Joint order matches third_party/ur_simulator's controller_manager
# (unprefixed UR joint names; identical on ur5e and ur15).

joint_impedance_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint

    end_effector_frame: tool0
    base_frame: base

    task:
      k_pos_x: 0.0
      k_pos_y: 0.0
      k_pos_z: 0.0
      k_rot_x: 0.0
      k_rot_y: 0.0
      k_rot_z: 0.0

    nullspace:
      stiffness: 50.0
      damping: -1.0          # auto: 2*sqrt(stiffness)
      projector_type: none   # direct joint PD
      max_tau: 20.0
      regularization: 1.0e-06
      weights:
        shoulder_pan_joint:  1.0
        shoulder_lift_joint: 1.0
        elbow_joint:         1.0
        wrist_1_joint:       1.0
        wrist_2_joint:       1.0
        wrist_3_joint:       1.0

    use_gravity_compensation: true
    use_coriolis_compensation: true
    use_friction: false
    use_local_jacobian: true

    limit_error: true
    limit_torques: true
    max_delta_tau: 0.5

    joint_limit_repulsion:
      enabled: true
      safe_range: 0.1
      max_torque: 5.0
