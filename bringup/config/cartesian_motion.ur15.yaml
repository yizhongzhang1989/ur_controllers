# cartesian_motion_controller — UR15 in MuJoCo sim (position mode).
#
# See bringup/config/cartesian_motion.ur5e.yaml for the architectural
# notes — everything there applies identically to ur15 because the UR
# joint names and standard description links (base_link, tool0) are
# shared across the UR family.
#
# Gains are intentionally identical to the ur5e config: this is a
# position-interface controller, not an effort one, so payload / inertia
# differences between the arms are handled by the sim's underlying
# position tracking (MuJoCo <position> actuators + PID) rather than by
# the Cartesian PD gains themselves. Keeping the gains identical also
# means the M5 comparison harness can flip between arms with one flag
# and still use the same pass/fail thresholds (ADR-0004).

cartesian_motion_controller:
  ros__parameters:
    end_effector_link: "tool0"
    robot_base_link: "base_link"

    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint

    command_interfaces:
      - position

    solver:
      error_scale: 1.0
      iterations: 10
      publish_state_feedback: True

    pd_gains:
      trans_x: {p: 1.0}
      trans_y: {p: 1.0}
      trans_z: {p: 1.0}
      rot_x: {p: 0.5}
      rot_y: {p: 0.5}
      rot_z: {p: 0.5}
